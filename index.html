<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Org Manager</title>
  <meta name="theme-color" content="#0e0d0b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root{--bg:#0e0d0b;--card:#1a1814;--line:#322d22;--gold:#f5b700;--ok:#3ddc84;--bad:#ff5c5c;--tx:#f4efe4;--mu:#a49b86;--or:#ff9900}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:78px}
    h2{margin:12px 0 8px;font-size:18px;color:var(--gold)}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;background:#100f0c;color:var(--tx);border:1px solid var(--line);border-radius:8px}
    textarea{min-height:90px;resize:vertical}
    button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:11px 14px;font-weight:800;cursor:pointer}
    button.g{background:#26221a;color:var(--tx);border:1px solid var(--line)}
    button.r{background:#3a1616;color:var(--bad)}
    button.s{padding:7px 10px;font-size:13px}
    button:disabled{opacity:.5}
    .w{max-width:560px;margin:0 auto;padding:12px}
    .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
    .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:20}
    .hd img{width:40px;height:40px;border-radius:8px;object-fit:cover}
    .hd b{flex:1;font-size:15px;line-height:1.2}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center;font-weight:700;cursor:pointer}
    .t span{display:block;font-size:24px;margin-bottom:4px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .mu{color:var(--mu);font-size:13px}
    .ok{color:var(--ok)}.bad{color:var(--bad)}.or{color:var(--or)}
    .big{font-size:22px;font-weight:900;color:var(--gold)}
    .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--gold);z-index:30}
    .nav a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--mu);cursor:pointer}
    .nav a.on{color:var(--gold);font-weight:800}
    .nav a div{font-size:18px;line-height:1.2}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center}
    .stat .n{font-size:22px;font-weight:900}
    .stat .l{font-size:11px;color:var(--mu);margin-top:3px;font-weight:700}
    .stat.g{border-color:var(--ok)}.stat.g .n{color:var(--ok)}
    .stat.r{border-color:var(--bad)}.stat.r .n{color:var(--bad)}
    .stat.o{border-color:var(--or)}.stat.o .n{color:var(--or)}
    .stat.y{border-color:var(--gold)}.stat.y .n{color:var(--gold)}
    .wel{display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}
    label.mu{display:block;margin-top:4px}
    .chip{display:inline-block;background:#003322;color:var(--ok);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:800}
    .list-card{border-bottom:1px solid var(--line);padding:10px 0}
    .list-card:last-child{border-bottom:0}
    
    #faceOverlay{display:none;position:fixed;inset:0;z-index:99999;background:#000;flex-direction:column}
    #faceOverlay.show{display:flex}
    #faceOverlay .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#111;border-bottom:1px solid var(--gold);flex-shrink:0}
    #faceOverlay .bar b{color:var(--gold)}
    #faceStage{flex:1;position:relative;min-height:0}
    #faceVideo,#faceCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #faceCanvas{pointer-events:none}
    #faceMsg{position:absolute;left:12px;right:12px;bottom:24px;background:rgba(0,0,0,.85);border:1.5px solid var(--gold);border-radius:12px;padding:14px;text-align:center;font-weight:800;color:var(--gold);z-index:2}
    #faceMsg.ok{border-color:var(--ok);color:var(--ok)}
    #faceMsg.bad{border-color:var(--bad);color:var(--bad)}
    #faceTimer{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.75);color:var(--gold);font-weight:900;font-size:22px;padding:8px 14px;border-radius:10px;z-index:2;border:1px solid var(--gold)}
    .previmg{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin:4px 0}
    .progress{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:12px;color:var(--mu)}
    .progress b{color:var(--gold)}

    #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:99;display:none;border:1px solid var(--gold);max-width:90%}

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<body>
<div id="app"><div class="wel"><div>Loading…<div class="mu" id="ls" style="margin-top:8px"></div></div></div></div>
<div id="faceOverlay">
  <div class="bar"><b id="faceName">Face</b><button class="g s" type="button" onclick="closeFace()">✕ Band</button></div>
  <div id="faceStage">
    <video id="faceVideo" playsinline muted autoplay></video>
    <canvas id="faceCanvas"></canvas>
    <div id="faceTimer">10</div>
    <div id="faceMsg">Ready</div>
  </div>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   ORG MANAGER — Phase 0 + Phase 1
   Multi-tenant: orgs/{uid}/people|attendance|fees|...
   Dashboard · Members · Admission · Attendance · Backup · Alerts
   ========================================================= */

// ---- Firebase: use your SaaS project. Replace if needed. ----
// Default points to gym-manager project; change to new project for production sell.
firebase.initializeApp({
  apiKey: "AIzaSyC5gfHQbzq67Bzk5K03vy3w3B4FnyC0oLs",
  authDomain: "gym-manager-app-76650.firebaseapp.com",
  projectId: "gym-manager-app-76650",
  storageBucket: "gym-manager-app-76650.firebasestorage.app",
  messagingSenderId: "837291846592",
  appId: "1:837291846592:web:2c4a81d694e0d643b8b625"
});

const auth = firebase.auth();
const db = firebase.firestore();
try { db.settings({ experimentalForceLongPolling: true, merge: true }); } catch (e) {}

const $ = (s) => document.querySelector(s);
const A = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const today = () => {
  const d = new Date();
  const z = d.getTimezoneOffset() * 60000;
  return new Date(d - z).toISOString().slice(0, 10);
};
const nowTime = () => new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

const COLS = ["people", "attendance", "fees", "staff", "staffAtt", "products", "sales", "expenses"];

let U = null;      // auth user
let G = null;      // org profile
let D = {};        // collections cache
let tab = "home";
let mode = "login"; // login | signup
let logoData = "";
let q = "";
let sd = today();
let sm = today().slice(0, 7);

function col(name) {
  return db.collection("orgs").doc(U.uid).collection(name);
}
function orgRef() {
  return db.collection("orgs").doc(U.uid);
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = "none"; }, 2800);
}

function st(msg) {
  const el = $("#ls");
  if (el) el.textContent = msg;
}

// ---------- forms ----------
function F(fields, values) {
  values = values || {};
  return fields.map(([k, label, type, opts]) => {
    type = type || "text";
    if (type === "sel") {
      return `<label class="mu">${label}</label><select id="f_${k}">${(opts || []).map(([v, t]) =>
        `<option value="${esc(v)}" ${String(values[k]) === String(v) ? "selected" : ""}>${esc(t)}</option>`
      ).join("")}</select>`;
    }
    if (type === "ta") {
      return `<label class="mu">${label}</label><textarea id="f_${k}">${esc(values[k] || "")}</textarea>`;
    }
    const val = values[k] != null ? values[k] : (type === "date" ? today() : "");
    return `<label class="mu">${label}</label><input id="f_${k}" type="${type}" value="${esc(val)}">`;
  }).join("");
}
function gf(fields) {
  const o = {};
  fields.forEach(([k, , type]) => {
    const el = $("#f_" + k);
    if (!el) { o[k] = ""; return; }
    o[k] = type === "number" ? (+el.value || 0) : el.value;
  });
  return o;
}

// ---------- data ----------
const tmo = (p, n) => Promise.race([
  p,
  new Promise((_, rej) => setTimeout(() => rej(new Error("Timeout: " + n)), 15000))
]);

async function loadAll() {
  for (const c of COLS) {
    st("Loading " + c + "…");
    try {
      const snap = await tmo(col(c).get(), c);
      D[c] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    } catch (e) {
      console.warn(c, e);
      D[c] = D[c] || [];
    }
  }
}

async function put(c, data, id) {
  const ref = id ? col(c).doc(id) : col(c).doc();
  await ref.set(data, { merge: true });
  const row = Object.assign({ id: ref.id }, data);
  const i = D[c].findIndex((x) => x.id === ref.id);
  if (i < 0) D[c].push(row);
  else Object.assign(D[c][i], data);
  return ref.id;
}

async function del(c, id) {
  await col(c).doc(id).delete();
  D[c] = D[c].filter((x) => x.id !== id);
}

// ---------- auth views ----------
function authView() {
  const su = mode === "signup";
  A.innerHTML = `<div class="w">
    <h2 style="font-size:22px;margin-top:24px">🏢 Org Manager</h2>
    <p class="mu">Attendance · People · Salary · Fees — multi organization</p>
    <div class="c">
      ${su ? `
        <label class="mu">Organization type</label>
        <select id="a_type">
          <option value="gym">Gym / Fitness</option>
          <option value="office">Office</option>
          <option value="school">School / Coaching</option>
          <option value="factory">Factory / Site</option>
          <option value="other">Other</option>
        </select>
        <label class="mu">Logo (optional)</label>
        <input type="file" accept="image/*" onchange="pickLogo(this)">
        ${F([
          ["gname", "Organization / Gym name"],
          ["owner", "Owner full name"],
          ["phone", "Contact phone", "tel"],
          ["addr", "Address"]
        ])}
      ` : ""}
      ${F([
        ["email", "Email", "email"],
        ["pw", "Password (min 6)", "password"]
      ])}
      <button style="width:100%" onclick="${su ? "doSignup()" : "doLogin()"}">${su ? "Sign up" : "Login"}</button>
      <p class="mu" style="text-align:center;margin-top:12px" onclick="mode='${su ? "login" : "signup"}';authView()">
        <u>${su ? "Already have account? Login" : "New organization? Sign up"}</u>
      </p>
    </div>
    <p class="mu" style="font-size:11px;margin-top:16px">Data har org ke liye alag safe rehta hai. Backup Report tab se lo.</p>
  </div>`;
}

window.pickLogo = function (inp) {
  const f = inp.files && inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = (e) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const x = c.getContext("2d");
      const s = Math.min(im.width, im.height);
      x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 128, 128);
      logoData = c.toDataURL("image/jpeg", 0.85);
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(f);
};

window.doSignup = async function () {
  try {
    const p = gf([
      ["gname"], ["owner"], ["phone"], ["addr"], ["email"], ["pw"]
    ]);
    const type = ($("#a_type") && $("#a_type").value) || "gym";
    if (!p.gname || !p.owner || !p.phone || !p.email || (p.pw || "").length < 6) {
      return alert("Saari zaroori details bharo (password min 6).");
    }
    st("Creating account…");
    const cred = await auth.createUserWithEmailAndPassword(p.email, p.pw);
    const profile = {
      name: p.gname,
      owner: p.owner,
      phone: p.phone,
      email: p.email,
      addr: p.addr || "",
      type,
      logo: logoData || "",
      termsHtml: defaultTerms(p.gname),
      alertWhatsApp: true,
      alertEmail: false,
      alertPhone: p.phone,
      alertEmailAddr: p.email,
      created: today(),
      status: "active"
    };
    await db.collection("orgs").doc(cred.user.uid).set(profile);
    toast("Account ready ✔");
  } catch (e) {
    alert(e.message || e);
  }
};

window.doLogin = async function () {
  try {
    const email = $("#f_email").value.trim();
    const pw = $("#f_pw").value;
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (e) {
    alert("Email ya password galat / account nahi mila.");
  }
};

function defaultTerms(name) {
  return `1. ${name || "Organization"} ke rules follow karna zaroori hai.\n2. Attendance / entry verification ke baad hi entry.\n3. Fees / dues time par clear karni hongi.\n4. Personal belongings ki zimmedari khud ki.\n5. Management rules change kar sakti hai — updated T&C app me dikhegi.`;
}

function fail(e) {
  A.innerHTML = `<div class="w"><h2>Dikkat</h2>
    <div class="c bad">${esc(e && e.message || e)}</div>
    <p class="mu">Agar "permission" / "Missing or insufficient" aaye to Firebase → Firestore → Rules me orgs rule Publish karo (neeche README).</p>
    <button onclick="location.reload()">Retry</button>
    <button class="g" onclick="auth.signOut()">Logout</button>
  </div>`;
}

// ---------- boot ----------
let booted = false;
auth.onAuthStateChanged(async (u) => {
  booted = true;
  U = u;
  if (!u) return authView();
  try {
    A.innerHTML = `<div class="wel"><div>Loading…<div class="mu" id="ls" style="margin-top:8px">Profile</div></div></div>`;
    let snap = null;
    for (let i = 0; i < 6; i++) {
      st("Profile try " + (i + 1));
      snap = await tmo(orgRef().get(), "org profile");
      if (snap.exists) break;
      await new Promise((r) => setTimeout(r, 400));
    }
    G = snap && snap.exists ? snap.data() : { name: "My Org", type: "gym" };
    st("Data…");
    await loadAll();
    A.innerHTML = `<div class="wel"><div>${G.logo ? `<img src="${G.logo}" style="width:96px;height:96px;border-radius:16px;object-fit:cover">` : `<div style="font-size:64px">🏢</div>`}
      <h2 style="font-size:24px">Welcome<br>${esc(G.name)}</h2>
      <p class="mu">${esc(G.type || "org")}</p></div></div>`;
    await new Promise((r) => setTimeout(r, 900));
    draw();
    autoBackupOnce();
  } catch (e) {
    console.error(e);
    fail(e);
  }
});

setTimeout(() => {
  if (!booted) {
    A.innerHTML = `<div class="w"><h2>Auth slow</h2><div class="c">Login check start nahi hua. Net check karke Retry dabao.</div>
      <button onclick="location.reload()">Retry</button></div>`;
  }
}, 10000);

// ---------- shell ----------
function go(t) { tab = t; draw(); }

function draw() {
  const N = [
    ["home", "🏠", "Home"],
    ["att", "✅", "Attendance"],
    ["people", "👥", "People"],
    ["admit", "📝", "Admit"],
    ["staff", "🧑‍🔧", "Staff"],
    ["store", "💊", "Store"],
    ["diet", "🥗", "Diet"],
    ["settings", "⚙️", "Settings"],
    ["rep", "📊", "Report"],
    ["master", "👑", "Master"]
  ];
  A.innerHTML = `
    <div class="hd">
      ${G.logo ? `<img src="${G.logo}">` : "🏢"}
      <b>${esc(G.name)}</b>
      <button class="g s" onclick="auth.signOut()">Logout</button>
    </div>
    <div class="w" id="v"></div>
    <div class="nav">${N.map((n) =>
      `<a class="${tab === n[0] ? "on" : ""}" onclick="go('${n[0]}')"><div>${n[1]}</div>${n[2]}</a>`
    ).join("")}</div>`;
  const map = { home, att: attV, people: peopleV, admit: admitV, staff: staffV, store: storeV, diet: dietV, settings: settingsV, rep, master: masterV };
  $("#v").innerHTML = (map[tab] || home)();
}

// ---------- helpers people ----------
function isDue(p) {
  if (!p) return false;
  if (p.validTill && p.validTill < today()) return true;
  const st = String(p.status || "").toLowerCase();
  if (st.indexOf("pending") >= 0 || st.indexOf("due") >= 0 || st === "bakaya") return true;
  if (Number(p.dueFee) > 0) return true;
  return false;
}

function presentIdsToday() {
  const set = new Set();
  (D.attendance || []).forEach((a) => {
    if (a.date === today()) set.add(String(a.personId || a.mid));
  });
  return set;
}

function statsBlock() {
  const people = D.people || [];
  const presentSet = presentIdsToday();
  let present = 0;
  people.forEach((p) => { if (presentSet.has(String(p.id))) present++; });
  if (presentSet.size > present) present = presentSet.size;
  const total = people.length;
  const absent = Math.max(0, total - present);
  const due = people.filter(isDue);
  const expired = people.filter((p) => p.validTill && p.validTill < today()).length;
  const expiring = people.filter((p) => {
    if (!p.validTill || p.validTill < today()) return false;
    const d0 = new Date(today());
    const d1 = new Date(p.validTill);
    return (d1 - d0) / 86400000 <= 7;
  }).length;
  const joinsToday = people.filter((p) => p.joined === today()).length;
  const feesToday = (D.fees || []).filter((f) => f.date === today()).reduce((s, f) => s + (Number(f.amt) || 0), 0);

  return `
    <div class="stats">
      <div class="stat y"><div class="n">${total}</div><div class="l">Total people</div></div>
      <div class="stat g"><div class="n">${present}</div><div class="l">Aaj present</div></div>
      <div class="stat r"><div class="n">${absent}</div><div class="l">Aaj absent</div></div>
      <div class="stat o"><div class="n">${due.length}</div><div class="l">Due / Expired</div></div>
    </div>
    <div class="c" style="margin-top:10px">
      <div class="row"><span class="mu">Aaj join</span><b>${joinsToday}</b></div>
      <div class="row"><span class="mu">Expiring 7 din</span><b class="or">${expiring}</b></div>
      <div class="row"><span class="mu">Already expired</span><b class="bad">${expired}</b></div>
      <div class="row"><span class="mu">Aaj fees collection</span><b class="ok">₹${feesToday}</b></div>
    </div>
    ${due.length ? `<div class="c"><b class="or">Due / Expired list</b>${due.slice(0, 15).map((p) =>
      `<div class="list-card row"><span>${esc(p.name)} <span class="mu">${esc(p.phone || "")}</span></span>
        <span class="or">${p.validTill && p.validTill < today() ? "Expired" : "Due"} ${p.dueFee ? "₹" + p.dueFee : ""}</span></div>`
    ).join("")}${due.length > 15 ? `<p class="mu">+${due.length - 15} aur…</p>` : ""}</div>` : ""}
  `;
}

// ---------- ADMISSION ----------
const AF = [
  ["name", "Pura naam *"],
  ["phone", "Mobile *", "tel"],
  ["gender", "Gender", "sel", [["M", "Male"], ["F", "Female"], ["O", "Other"]]],
  ["father", "Father / Husband name"],
  ["dob", "Date of birth", "date"],
  ["age", "Age (years)", "number"],

function resizeFile(file, maxW, maxH, cb){
  const r = new FileReader();
  r.onload = function(e){
    const im = new Image();
    im.onload = function(){
      let w = im.width, h = im.height;
      const ratio = Math.min(maxW/w, maxH/h, 1);
      w = Math.round(w*ratio); h = Math.round(h*ratio);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      cb(c.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = function(){ cb(""); };
    im.src = e.target.result;
  };
  r.readAsDataURL(file);
}

function addMonths(dateStr, months) {
  const x = new Date(dateStr || today());
  x.setMonth(x.getMonth() + (months || 1));
  return x.toISOString().slice(0, 10);
}

const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model";
const MODEL_URL_ALT = "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights";
const MATCH_THRESHOLD = 0.68;
let modelsLoaded = false, faceStream = null, faceMember = null, faceTarget = null, faceMatching = false, faceDraw = false, faceTimer = null, faceLeft = 10;

async function loadFaceModels(){
  if (modelsLoaded) return true;
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    modelsLoaded = true; return true;
  } catch(e1){
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL_ALT);
      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL_ALT);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL_ALT);
      modelsLoaded = true; return true;
    } catch(e2){ console.error(e2); return false; }
  }
}
function faceMsg(t, cls){ const el=$("#faceMsg"); el.className=cls||""; el.innerHTML=t; }
async function descriptorFromUrl(url){
  if(!url || url.length<40) return null;
  try{
    const img = await faceapi.fetchImage(url);
    const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.35})).withFaceLandmarks(true).withFaceDescriptor();
    return det ? det.descriptor : null;
  }catch(e){ return null; }
}
window.openFaceFor = async function(id){
  const p = (D.people||[]).find(x=>x.id===id);
  if(!p) return;
  if(presentIdsToday().has(String(id))) return alert(p.name+" aaj pehle se Present.");
  faceMember = p; faceTarget = null; faceMatching = false;
  $("#faceName").textContent = p.name || "Face";
  $("#faceOverlay").classList.add("show");
  faceMsg("Models…","");
  if(!(await loadFaceModels())){ faceMsg("Models load fail — Quick use karo","bad"); return; }
  faceMsg("Registered photo…","");
  faceTarget = await descriptorFromUrl(p.photo || p.memberPhoto || "");
  if(!faceTarget) faceMsg("Photo me clear face nahi — end pe confirm maangenge","bad");
  try{
    faceStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    const v = $("#faceVideo"); v.srcObject = faceStream; await v.play();
    faceDraw = true; requestAnimationFrame(faceLoop);
    faceLeft = 10; $("#faceTimer").textContent = faceLeft;
    clearInterval(faceTimer);
    faceTimer = setInterval(async ()=>{
      faceLeft--; $("#faceTimer").textContent = Math.max(0,faceLeft);
      if(faceLeft<=0){ clearInterval(faceTimer); await tryFaceMatch(true); }
    },1000);
    setTimeout(()=>tryFaceMatch(false),2500);
    setTimeout(()=>tryFaceMatch(false),5000);
    setTimeout(()=>tryFaceMatch(false),7500);
    faceMsg("Chehra rakho — 10 sec auto"," ");
  }catch(e){ faceMsg("Camera permission chahiye","bad"); }
};
async function tryFaceMatch(force){
  if(faceMatching || !faceStream || !faceMember) return;
  faceMatching = true;
  const v = $("#faceVideo");
  try{
    const det = await faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.35})).withFaceLandmarks(true).withFaceDescriptor();
    if(!det){ if(force) faceMsg("Face detect nahi","bad"); faceMatching=false; return; }
    if(!faceTarget){
      if(force && confirm(faceMember.name+" — registered face nahi. Present mark?")){
        await markWithMode(faceMember, "face-live"); closeFace();
      }
      faceMatching=false; return;
    }
    const dist = faceapi.euclideanDistance(det.descriptor, faceTarget);
    if(dist <= MATCH_THRESHOLD){
      clearInterval(faceTimer);
      faceMsg("Match "+dist.toFixed(2)+" — Present…","ok");
      await markWithMode(faceMember, "face");
      setTimeout(closeFace, 1000);
    } else if(force) faceMsg("Match nahi ("+dist.toFixed(2)+")","bad");
    else faceMsg("Detect… "+dist.toFixed(2)," ");
  }catch(e){ if(force) faceMsg(String(e.message||e),"bad"); }
  faceMatching = false;
}
function faceLoop(){
  if(!faceDraw || !faceStream) return;
  const v=$("#faceVideo"), c=$("#faceCanvas");
  if(v.readyState>=2){
    c.width=v.videoWidth; c.height=v.videoHeight;
    const ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
    faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.4})).then(det=>{
      if(!det||!faceDraw) return;
      ctx.strokeStyle="#3ddc84"; ctx.lineWidth=4;
      ctx.strokeRect(det.box.x,det.box.y,det.box.width,det.box.height);
    }).catch(()=>{});
  }
  setTimeout(()=>requestAnimationFrame(faceLoop),250);
}
window.closeFace = function(){
  clearInterval(faceTimer); faceDraw=false; faceMatching=false; faceMember=null; faceTarget=null;
  if(faceStream){ faceStream.getTracks().forEach(t=>t.stop()); faceStream=null; }
  const v=$("#faceVideo"); if(v) v.srcObject=null;
  $("#faceOverlay").classList.remove("show");
};
async function markWithMode(p, mode){
  const rec = { date: today(), personId: p.id, mid: p.id, name: p.name, time: nowTime(), mode: mode||"quick", at: new Date().toISOString() };

  const day = (Number(st.sal)||0)/30, hr = day/(Number(st.hrs)||8);
  let d=0,pen=0,inc=0,net=0;
  (D.staffAtt||[]).filter(r=>r.staffId===st.id && String(r.date).slice(0,7)===ym).forEach(r=>{
    if(r.st==="A") return;
    d++; const p=Math.min(day,(Number(r.pen)||0)*hr); pen+=p; inc+=Number(r.inc)||0; net+=day-p+(Number(r.inc)||0);
  });
  return {d, pen:Math.round(pen), inc:Math.round(inc), net:Math.round(net)};
}

window.addProduct = async function(){
  const name = $("#f_pname").value.trim();
  const buy = +$("#f_buy").value||0, sell = +$("#f_sell").value||0, qty = +$("#f_qty").value||0;
  if(!name) return alert("Name required");

};
window.addStock = async function(id){
  const p = (D.products||[]).find(x=>x.id===id); if(!p) return;
  const n = +prompt("Kitna naya stock?", 1); if(!n) return;
  await put("products", { qty: (Number(p.qty)||0)+n }, id);
  go("store");
};
window.sellProduct = async function(id){
  const p = (D.products||[]).find(x=>x.id===id); if(!p) return;
  const n = +prompt("Kitne beche?", 1); if(!n) return;
  if(n > Number(p.qty)) return alert("Itna stock nahi");
  await put("products", { qty: Number(p.qty)-n }, id);
  await put("sales", { date: today(), productId: id, name: p.name, qty: n, amt: n*Number(p.sell), profit: n*(Number(p.sell)-Number(p.buy)) });
  toast("Sold ✔"); go("store");
};
