<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Manager</title>
<!-- FIRESTORE RULES (Firebase Console > Firestore > Rules me paste karo, tabhi har gym ka data alag rahega):
rules_version='2'; service cloud.firestore { match /databases/{d}/documents { match /gyms/{g}/{document=**} { allow read, write: if request.auth != null && request.auth.uid == g; } } }
Auth: Console > Authentication > Sign-in method > Email/Password ON karo. -->
<style>
:root{--bg:#0e0d0b;--card:#1a1814;--line:#322d22;--gold:#f5b700;--ok:#3ddc84;--bad:#ff5c5c;--tx:#f4efe4;--mu:#a49b86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",sans-serif;padding-bottom:72px}
h2{margin:14px 0 8px;font-size:18px;color:var(--gold)}input,select,button,textarea{font:inherit}
input,select{width:100%;padding:11px;margin:4px 0 8px;background:#100f0c;color:var(--tx);border:1px solid var(--line);border-radius:8px}
button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
button.g{background:#26221a;color:var(--tx);border:1px solid var(--line)}button.r{background:#3a1616;color:var(--bad)}button.s{padding:6px 10px;font-size:13px}
.w{max-width:560px;margin:0 auto;padding:12px}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:5}
.hd img{width:40px;height:40px;border-radius:8px;object-fit:cover}.hd b{flex:1;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center;font-weight:700;cursor:pointer}
.t span{display:block;font-size:26px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--gold)}
.nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--mu);cursor:pointer}.nav a.on{color:var(--gold);font-weight:700}
.big{font-size:22px;font-weight:800;color:var(--gold)}.wel{display:grid;place-items:center;height:100vh;text-align:center}.wel img{width:110px;height:110px;border-radius:20px;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head>
<body><div id="app"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyA9z1gXZDB3W0lJxyHV9x2vWeb0Ees7z-g",authDomain:"brother-s-fitness-club.firebaseapp.com",projectId:"brother-s-fitness-club",storageBucket:"brother-s-fitness-club.firebasestorage.app",messagingSenderId:"781489019006",appId:"1:781489019006:web:4a230698f2195e7208202f"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const COLS=['members','fees','att','staff','staffatt','products','sales','expenses'];
let U,G,D={},tab='home',mode='login',logo='',sd=today(),sm=today().slice(0,7),q='';
const col=n=>db.collection('gyms').doc(U.uid).collection(n);
async function loadAll(){for(const c of COLS)D[c]=(await col(c).get()).docs.map(d=>({id:d.id,...d.data()}))}
async function put(c,o,id){const r=id?col(c).doc(id):col(c).doc();await r.set(o,{merge:true});const i=D[c].findIndex(x=>x.id===r.id);if(i<0)D[c].push({id:r.id,...o});else Object.assign(D[c][i],o);return r.id}
async function del(c,id){await col(c).doc(id).delete();D[c]=D[c].filter(x=>x.id!==id)}
const go=t=>{tab=t;draw()};
// ---------- form helper ----------
const F=(fs,v={})=>fs.map(([k,l,t,o])=>`<label class="mu">${l}</label>`+(t==='sel'?`<select id="f_${k}">${o.map(x=>`<option value="${x[0]}" ${v[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t||'text'}" value="${esc(v[k]??(t==='date'?today():''))}">`)).join('');
const gf=fs=>Object.fromEntries(fs.map(([k,,t])=>{let x=$('#f_'+k).value;return[k,t==='number'?+x||0:x]}));
// ---------- auth ----------
function authView(){
 const su=mode==='signup';
 A.innerHTML=`<div class="w"><h2 style="font-size:24px">🏋️ Gym Manager</h2><div class="c">
 ${su?`<label class="mu">Account type</label><select id="a_type" onchange="$('#bz').style.display=this.value=='biz'?'block':'none'"><option value="per">Personal — Gym</option><option value="biz">Business — Car Showroom</option></select>
 <div id="bz" class="bad" style="display:none">Car Showroom abhi jald aa raha hai. Abhi Personal — Gym chuno.</div>
 <label class="mu">Gym logo (optional)</label><input type="file" accept="image/*" onchange="pickLogo(this)">
 ${F([['gname','Gym ka naam'],['owner','Owner ka poora naam'],['phone','Contact no','tel'],['addr','Gym ka address']])}`:''}
 ${F([['email','Email id','email'],['pw','Password (min 6)','password']])}
 <button style="width:100%" onclick="${su?'signup()':'login()'}">${su?'Sign up':'Login'}</button>
 <p class="mu" style="text-align:center" onclick="mode='${su?'login':'signup'}';authView()"><u>${su?'Pehle se account hai? Login':'Naya gym? Sign up karo'}</u></p></div></div>`}
function pickLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);logo=c.toDataURL('image/jpeg',.8)};im.src=e.target.result};r.readAsDataURL(f)}
async function signup(){try{
 if($('#a_type').value=='biz')return alert('Car Showroom abhi jald aa raha hai. Personal — Gym chuno.');
 const p=gf([['gname'],['owner'],['phone'],['addr'],['email'],['pw']]);
 if(!p.gname||!p.owner||!p.phone||!p.addr||!p.email||p.pw.length<6)return alert('Saari details bharo (password kam se kam 6).');
 const c=await auth.createUserWithEmailAndPassword(p.email,p.pw);
 await db.collection('gyms').doc(c.user.uid).set({name:p.gname,owner:p.owner,phone:p.phone,email:p.email,addr:p.addr,type:'gym',logo,created:today()});
}catch(e){alert(e.message)}}
async function login(){try{await auth.signInWithEmailAndPassword($('#f_email').value,$('#f_pw').value)}catch(e){alert('Email ya password galat hai.')}}
auth.onAuthStateChanged(async u=>{U=u;if(!u)return authView();
 A.innerHTML='<div class="wel"><div>Loading…</div></div>';
 let s;for(let i=0;i<5&&!(s&&s.exists);i++){s=await db.collection('gyms').doc(u.uid).get();if(!s.exists)await new Promise(r=>setTimeout(r,500))}
 G=s.data()||{name:'My Gym'};await loadAll();
 A.innerHTML=`<div class="wel"><div>${G.logo?`<img src="${G.logo}">`:'<div style="font-size:70px">🏋️</div>'}<h2 style="font-size:26px">Welcome to<br>${esc(G.name)}</h2></div></div>`;
 await new Promise(r=>setTimeout(r,1500));draw();autoBackup()});
// ---------- layout ----------
function draw(){const N=[['home','🏠','Home'],['att','✅','Attendance'],['members','👥','Members'],['staff','🧑‍🔧','Staff'],['store','💊','Store'],['rep','📊','Report']];
 A.innerHTML=`<div class="hd">${G.logo?`<img src="${G.logo}">`:'🏋️'}<b>${esc(G.name)}</b><button class="g s" onclick="auth.signOut()">Logout</button></div><div class="w" id="v"></div><div class="nav">${N.map(n=>`<a class="${tab==n[0]||(tab=='admit'&&n[0]=='members')?'on':''}" onclick="go('${n[0]}')"><div style="font-size:18px">${n[1]}</div>${n[2]}</a>`).join('')}</div>`;
 $('#v').innerHTML=({home,admit,att:attV,members:memV,staff:stV,store:stoV,rep})[tab]()}
const T=(i,l,t)=>`<div class="t" onclick="go('${t}')"><span>${i}</span>${l}</div>`;
function home(){const n=D.members.length,p=D.att.filter(a=>a.date==today()).length;
 return`<h2>Aaj ka haal</h2><div class="c row"><div><div class="big">${p}</div><div class="mu">aaj present</div></div><div><div class="big">${n}</div><div class="mu">kul member</div></div></div>
 <div class="grid">${T('📝','Admission Form','admit')}${T('✅','Attendance','att')}${T('👥','Gym Members','members')}${T('💰','Fees','members')}${T('💊','Supplement Store','store')}${T('🥗','Diet Chart','home')}${T('🧑‍🔧','Staff Salary','staff')}${T('📊','Report / Backup','rep')}</div><p class="mu">Diet Chart module jald aa raha hai.</p>`}
// ---------- admission / members / attendance ----------
const AF=[['name','Naam'],['phone','Mobile','tel'],['father','Father / Husband ka naam'],['plan','Plan (mahine)','number'],['fee','Fees ₹','number'],['joined','Joining date','date'],['slot','Batch','sel',[['Morning','Morning'],['Evening','Evening']]]];
const admit=()=>`<h2>Naya Admission</h2><div class="c">${F(AF)}<button style="width:100%" onclick="saveAdmit()">Admission Save karo</button></div>`;
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
async function saveAdmit(){const m=gf(AF);if(!m.name||!m.phone)return alert('Naam aur mobile zaroori hai.');m.plan=m.plan||1;m.validTill=addM(m.joined,m.plan);
 const id=await put('members',m);if(m.fee)await put('fees',{date:m.joined,mid:id,name:m.name,amt:m.fee});alert('Admission ho gaya ✔');go('members')}
const mList=(btn)=>`<input placeholder="🔍 Naam / mobile" value="${esc(q)}" oninput="q=this.value;$('#ml').innerHTML=mRows()">`+`<div id="ml">${mRows()}</div>`;
let mBtn=()=>'';
const mRows=()=>D.members.filter(m=>(m.name+m.phone).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<div class="c"><div class="row"><b>${esc(m.name)}</b><span class="${m.validTill<today()?'bad':'ok'}">${m.validTill<today()?'Expired':'Active'} · ${m.validTill}</span></div><div class="mu">${esc(m.phone)} · ${esc(m.slot)}</div><div style="margin-top:8px">${mBtn(m)}</div></div>`).join('')||'<p class="mu">Koi member nahi.</p>';
function attV(){const p=new Set(D.att.filter(a=>a.date==today()).map(a=>a.mid));mBtn=m=>p.has(m.id)?`<button class="g s" onclick="unmark('${m.id}')">✔ Present (hatao)</button>`:`<button class="s" onclick="mark('${m.id}')">Present lagao</button>`;
 return`<h2>Aaj ki Attendance — ${p.size}</h2>`+mList()}
async function mark(id){const m=D.members.find(x=>x.id==id);await put('att',{date:today(),mid:id,name:m.name,time:new Date().toLocaleTimeString('en-IN')},today()+'_'+id);draw()}
async function unmark(id){await del('att',today()+'_'+id);draw()}
function memV(){mBtn=m=>`<button class="s" onclick="fee('${m.id}')">💰 Fees lo</button> <button class="g s" onclick="stat('${m.id}')">Din</button> <button class="r s" onclick="delM('${m.id}')">Delete</button>`;
 return`<div class="row"><h2>Gym Members (${D.members.length})</h2><button class="s" onclick="go('admit')">+ Naya</button></div>`+mList()}
async function fee(id){const m=D.members.find(x=>x.id==id),a=+prompt('Fees kitni mili ₹?',m.fee||'');if(!a)return;const mo=+prompt('Kitne mahine ke liye?',m.plan||1);if(!mo)return;
 const b=m.validTill>today()?m.validTill:today();await put('members',{validTill:addM(b,mo)},id);await put('fees',{date:today(),mid:id,name:m.name,amt:a});draw()}
function stat(id){const m=D.members.find(x=>x.id==id),d=D.att.filter(a=>a.mid==id&&a.date.slice(0,7)==today().slice(0,7)).length;alert(`${m.name}\nIs mahine aaya: ${d} din\nValid till: ${m.validTill}`)}
async function delM(id){if(confirm('Member delete karein?')){await del('members',id);draw()}}
// ---------- staff + salary ----------
const SF=[['name','Staff ka naam'],['role','Kaam (Cleaner / Trainer / Reception…)'],['gender','Male / Female','sel',[['Male','Male'],['Female','Female']]],['phone','Mobile','tel'],['kin','Father / Husband-Wife ka naam'],['addr','Current address'],['home','Home town address'],['idp','ID proof (naam / number)'],['exp','Pehle ka work experience'],['join','Join date','date'],['shift','Shift (jaise 6am–2pm)'],['hrs','Shift ke ghante','number'],['sal','Mahine ki salary ₹','number'],['off','Weekly off','sel',['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>[i,x])]];
let shF=false;
function stV(){return`<div class="row"><h2>Staff</h2><button class="s" onclick="shF=!shF;draw()">+ Naya Staff</button></div>
 ${shF?`<div class="c">${F(SF,{hrs:8})}<button style="width:100%" onclick="saveSt()">Staff Save karo</button></div>`:''}
 <div class="c"><label class="mu">Din chuno (hazri / penalty)</label><input type="date" value="${sd}" onchange="sd=this.value;draw()">${D.staff.map(s=>{const r=D.staffatt.find(x=>x.id==sd+'_'+s.id)||{};
 return`<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><b>${esc(s.name)} <span class="mu">${esc(s.role)}</span></b><span class="mu">₹${s.sal}/mah</span></div>
 <div class="row"><select id="s_${s.id}"><option value="P" ${r.st=='P'?'selected':''}>Present</option><option value="A" ${r.st=='A'?'selected':''}>Absent</option><option value="W" ${r.st=='W'?'selected':''}>Weekly off</option></select>
 <input id="p_${s.id}" type="number" placeholder="Late/penalty ghante" value="${r.pen||''}"><input id="i_${s.id}" type="number" placeholder="Incentive ₹" value="${r.inc||''}"></div>
 <button class="s" onclick="saveDay('${s.id}')">Save</button> <button class="r s" onclick="delDay('${s.id}')">Din hatao</button> <button class="g s" onclick="delSt('${s.id}')">Staff delete</button></div>`}).join('')||'<p class="mu">Abhi koi staff nahi.</p>'}</div>
 <h2>Mahine ki Salary</h2><div class="c"><input type="month" value="${sm}" onchange="sm=this.value;draw()"><div style="overflow-x:auto"><table><tr><th>Naam</th><th>Din</th><th>Penalty</th><th>Incentive</th><th>Net ₹</th></tr>${D.staff.map(s=>{const c=sal(s,sm);return`<tr><td>${esc(s.name)}</td><td>${c.d}</td><td>-${c.pen}</td><td>+${c.inc}</td><td><b>${c.net}</b></td></tr>`}).join('')}</table></div>
 <p class="mu">Per din = salary ÷ 30. Penalty = per din ÷ shift ke ghante × late ghante. Weekly off paid hai.</p></div>`}
function sal(s,ym){const day=s.sal/30,hr=day/(s.hrs||8);let d=0,pen=0,inc=0,net=0;D.staffatt.filter(r=>r.sid==s.id&&r.date.slice(0,7)==ym).forEach(r=>{if(r.st=='A')return;d++;const p=Math.min(day,(r.pen||0)*hr);pen+=p;inc+=r.inc||0;net+=day-p+(r.inc||0)});return{d,pen:Math.round(pen),inc:Math.round(inc),net:Math.round(net)}}
async function saveSt(){const s=gf(SF);if(!s.name||!s.sal)return alert('Naam aur salary zaroori hai.');await put('staff',s);shF=false;draw()}
async function saveDay(id){await put('staffatt',{sid:id,date:sd,st:$('#s_'+id).value,pen:+$('#p_'+id).value||0,inc:+$('#i_'+id).value||0},sd+'_'+id);draw()}
async function delDay(id){await del('staffatt',sd+'_'+id);draw()}
async function delSt(id){if(confirm('Staff delete karein?')){await del('staff',id);draw()}}
// ---------- supplement store ----------
const PF=[['name','Product ka naam'],['buy','Kharid rate ₹','number'],['sell','Bikri rate ₹','number'],['qty','Maal (quantity)','number']];
function stoV(){const low=D.products.filter(p=>p.qty<=3);
 return`<h2>Supplement Store</h2>${low.length?`<div class="c bad">⚠ Kam maal: ${low.map(p=>esc(p.name)+' ('+p.qty+')').join(', ')}</div>`:''}
 <div class="c">${D.products.map(p=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.name)}</b><div class="mu">₹${p.sell} · bacha: <span class="${p.qty<=3?'bad':'ok'}">${p.qty}</span></div></div><div><button class="s" onclick="sell('${p.id}')">Becho</button> <button class="g s" onclick="stk('${p.id}')">+Stock</button></div></div>`).join('')||'<p class="mu">Product add karo.</p>'}</div>
 <div class="c"><b>Naya product</b>${F(PF)}<button style="width:100%" onclick="addP()">Add</button></div>`}
async function addP(){const p=gf(PF);if(!p.name)return;await put('products',p);draw()}
async function stk(id){const p=D.products.find(x=>x.id==id),n=+prompt('Kitna naya maal aaya?');if(n>0){await put('products',{qty:p.qty+n},id);draw()}}
async function sell(id){const p=D.products.find(x=>x.id==id),n=+prompt('Kitne bike?',1);if(!n)return;if(n>p.qty)return alert('Itna maal nahi hai.');
 await put('products',{qty:p.qty-n},id);await put('sales',{date:today(),pid:id,name:p.name,qty:n,amt:n*p.sell,profit:n*(p.sell-p.buy)});draw()}
// ---------- report + backup ----------
function rep(){const t=today(),f=D.fees.filter(x=>x.date==t),s=D.sales.filter(x=>x.date==t),e=D.expenses.filter(x=>x.date==t),k=a=>a.reduce((z,x)=>z+(x.amt||0),0);
 const fc=k(f),sc=k(s),sp=s.reduce((z,x)=>z+x.profit,0),ex=k(e);
 return`<h2>Aaj ka Report (${t})</h2><div class="c"><table>
 <tr><td>Naye admission</td><td><b>${D.members.filter(m=>m.joined==t).length}</b></td></tr><tr><td>Fees jama (${f.length} log)</td><td><b>₹${fc}</b></td></tr>
 <tr><td>Supplement bikri</td><td><b>₹${sc}</b></td></tr><tr><td>Supplement profit</td><td class="ok"><b>₹${sp}</b></td></tr>
 <tr><td>Kul collection</td><td class="big">₹${fc+sc}</td></tr><tr><td>Kharcha</td><td class="bad">₹${ex}</td></tr><tr><td>Bacha (collection − kharcha)</td><td class="big">₹${fc+sc-ex}</td></tr></table>
 <button class="g s" style="margin-top:8px" onclick="addEx()">+ Kharcha likho</button></div>
 <h2>Backup</h2><div class="c"><p class="mu">Roz app pehli baar khulte hi poore data ki Excel file apne aap download hoti hai. Last backup: ${localStorage.getItem('bk_'+U.uid)||'abhi nahi'}</p><button style="width:100%" onclick="backup()">📥 Abhi Excel Backup lo</button></div>`}
async function addEx(){const a=+prompt('Kharcha kitna ₹?');if(!a)return;const n=prompt('Kis cheez ka? (bijli, kiraya…)')||'';await put('expenses',{date:today(),amt:a,note:n});draw()}
function backup(){const w=XLSX.utils.book_new();COLS.forEach(c=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(D[c].length?D[c]:[{}]),c));
 XLSX.writeFile(w,`${(G.name||'gym').replace(/\W+/g,'_')}_backup_${today()}.xlsx`);localStorage.setItem('bk_'+U.uid,today())}
function autoBackup(){try{if(localStorage.getItem('bk_'+U.uid)!==today())backup()}catch(e){}}
</script></body></html>
